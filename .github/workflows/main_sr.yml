
name: Build and deploy portfolio to Azure Web App - SR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: SR
  AZURE_WEBAPP_PACKAGE_PATH: .

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website files
        shell: pwsh
        run: |
          Write-Host "Repository files:"
          Get-ChildItem -Force

          if (-not (Test-Path "index.html")) {
            Write-Error "index.html not found in the repository root. Check the website folder."
            exit 1
          }

      - name: Prepare deployment package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish -Force | Out-Null

          Get-ChildItem -Force |
            Where-Object { $_.Name -notin @(".git", ".github", "publish") } |
            Copy-Item -Destination publish -Recurse -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: publish/

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-site
          path: publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_17108AE6BFF74323ACFBB3EE444F860B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E9B63834290D49E283500ADA77BCDF71 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C1FAE4369BD475DB1EE0612287D1D4A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: SR
          slot-name: Production
          package: publish/
