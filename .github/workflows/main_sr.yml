
name: Deploy portfolio to Azure Web App - FF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website files
        shell: pwsh
        run: |
          $required = @(
            "index.html",
            "web.config",
            "assets"
          )

          foreach ($item in $required) {
            if (-not (Test-Path $item)) {
              throw "Required website file or folder not found: $item"
            }
          }

          Write-Host "Website files verified successfully."

      - name: Create deployment package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path index.html, web.config, assets `
            -DestinationPath site.zip `
            -Force

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-package
          path: site.zip
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-package
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_53C99637525241B1A23BE2B98643CE9F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_784EBA500AEA47C39D9E7D6C25F85C8C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7E6E95E69456472AA3E85819373A1EB6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: FF
          slot-name: Production
          package: site.zip
