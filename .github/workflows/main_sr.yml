# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - SR

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  # UPDATE THIS: Set the path to your solution file (.sln) relative to the repository root
  SOLUTION_PATH: 'YourSolutionName.sln' 

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      # Updated to target the specific solution file
      - name: Restore NuGet packages
        run: nuget restore ${{ env.SOLUTION_PATH }}

      # Updated to target the solution file and use a safe workspace path for publishing
      - name: Publish to folder
        run: msbuild ${{ env.SOLUTION_PATH }} /nologo /verbosity:m /t:Build /t:pipelinePreDeployCopyAllFilesToOneFolder /p:_PackageTempDir="${{ github.workspace }}\published\"

      # Updated path to match the workspace variable above
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: '${{ github.workspace }}\published\**'

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_17108AE6BFF74323ACFBB3EE444F860B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E9B63834290D49E283500ADA77BCDF71 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C1FAE4369BD475DB1EE0612287D1D4A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SR'
          slot-name: 'Production'
          package: .
