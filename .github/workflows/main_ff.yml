
name: Build and deploy ASP app to Azure Web App - FF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Find solution or project file
        id: project
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Recurse -File -Filter "*.sln" |
            Select-Object -First 1

          if ($sln) {
            $file = $sln.FullName
            $type = "solution"
          }
          else {
            $csproj = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Recurse -File -Filter "*.csproj" |
              Select-Object -First 1

            if (-not $csproj) {
              throw "No .sln or .csproj file found. Check your repository contents."
            }

            $file = $csproj.FullName
            $type = "project"
          }

          Write-Host "Found $type file: $file"
          "file=$file" >> $env:GITHUB_OUTPUT
          "type=$type" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $file = "${{ steps.project.outputs.file }}"
          nuget restore "$file"

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet package restore failed."
          }

      - name: Build and publish application
        shell: pwsh
        run: |
          $file = "${{ steps.project.outputs.file }}"
          $publishDir = "$env:GITHUB_WORKSPACE\_published"

          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          msbuild "$file" `
            /nologo `
            /verbosity:minimal `
            /t:Build `
            /p:Configuration=Release `
            /p:DeployOnBuild=true `
            /p:WebPublishMethod=FileSystem `
            /p:PublishUrl="$publishDir"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed. Check the build output."
          }

          if (-not (Get-ChildItem $publishDir -Force)) {
            throw "Publish directory is empty. Check the project publish settings."
          }

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: _published/
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: _published

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_53C99637525241B1A23BE2B98643CE9F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_784EBA500AEA47C39D9E7D6C25F85C8C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7E6E95E69456472AA3E85819373A1EB6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: FF
          slot-name: Production
          package: _published/
